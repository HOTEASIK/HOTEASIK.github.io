- id: physical-chemistry
  label: 물리화학
  inputs: [physics, chemistry]
  post: physical-chemistry

- id: multimodal
  label: 멀티모달 모델
  inputs: [cnn, llm]
  post: multimodal

- id: f1
  label: F1 점수
  inputs: [precision, recall]
  post: f1
