#   loose:  true 면 inputs 를 "포함"만 해도 인식 (기본은 정확히 그 집합)
#   post:   완성 시 이동할 글 slug

- id: vla
  label: VLA (Vision-Language-Action)
  inputs: [cnn, llm, robotics]
