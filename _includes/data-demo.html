<!-- 데이터 전처리 전용 위젯: 처리 전/후를 눈으로 비교. include.type 로 종류 선택. -->
<div class="data-demo" data-demo="{{ include.type }}">
  <button type="button" class="data-demo-toggle" aria-pressed="false">후 보기 →</button>
  <div class="data-demo-stage">

  {%- case include.type -%}

  {%- when "missing-value" -%}
    <svg class="data-demo-before" viewBox="0 0 240 120" role="img" aria-label="결측치가 있는 표">
      {%- for row in (0..2) -%}{%- for col in (0..2) -%}
      {%- assign x = col | times: 76 | plus: 10 -%}{%- assign y = row | times: 36 | plus: 10 -%}
      {%- assign key = row | append: col -%}
      <rect x="{{ x }}" y="{{ y }}" width="66" height="28" rx="2"
        fill="none" stroke="{% if key == '01' or key == '10' or key == '22' %}#ef4444{% else %}var(--neon-cyan){% endif %}" stroke-width="2"/>
      {%- if key == '01' or key == '10' or key == '22' -%}
      <text x="{{ x | plus: 33 }}" y="{{ y | plus: 19 }}" text-anchor="middle" font-size="14" fill="#ef4444">✕</text>
      {%- endif -%}
      {%- endfor -%}{%- endfor -%}
    </svg>
    <svg class="data-demo-after" viewBox="0 0 240 120" role="img" aria-label="결측치를 채운 표" hidden>
      {%- for row in (0..2) -%}{%- for col in (0..2) -%}
      {%- assign x = col | times: 76 | plus: 10 -%}{%- assign y = row | times: 36 | plus: 10 -%}
      {%- assign key = row | append: col -%}
      <rect x="{{ x }}" y="{{ y }}" width="66" height="28" rx="2"
        fill="{% if key == '01' or key == '10' or key == '22' %}rgb(16 185 129 / 15%){% else %}none{% endif %}"
        stroke="{% if key == '01' or key == '10' or key == '22' %}#10b981{% else %}var(--neon-cyan){% endif %}" stroke-width="2"/>
      {%- if key == '01' or key == '10' or key == '22' -%}
      <text x="{{ x | plus: 33 }}" y="{{ y | plus: 19 }}" text-anchor="middle" font-size="12" fill="#10b981">0.42</text>
      {%- endif -%}
      {%- endfor -%}{%- endfor -%}
    </svg>

  {%- when "feature-scaling" -%}
    <svg class="data-demo-before" viewBox="0 0 240 120" role="img" aria-label="스케일링 전 흩어진 값">
      <line x1="20" y1="100" x2="220" y2="100" stroke="var(--text-muted-color, #889)" stroke-width="1"/>
      <line x1="20" y1="10" x2="20" y2="100" stroke="var(--text-muted-color, #889)" stroke-width="1"/>
      <text x="14" y="112" font-size="10" fill="var(--text-muted-color, #889)">0</text>
      <text x="196" y="112" font-size="10" fill="var(--text-muted-color, #889)">1000</text>
      {%- assign xs = "30,50,150,200,90,210,40,170,120,60,190,110" | split: "," -%}
      {%- assign ys = "80,30,60,95,15,45,70,25,85,55,20,90" | split: "," -%}
      {%- for x in xs -%}
      <circle cx="{{ x }}" cy="{{ ys[forloop.index0] }}" r="4" fill="var(--neon-magenta)"/>
      {%- endfor -%}
    </svg>
    <svg class="data-demo-after" viewBox="0 0 240 120" role="img" aria-label="스케일링 후 0~1 범위로 모인 값" hidden>
      <line x1="20" y1="100" x2="220" y2="100" stroke="var(--text-muted-color, #889)" stroke-width="1"/>
      <line x1="20" y1="10" x2="20" y2="100" stroke="var(--text-muted-color, #889)" stroke-width="1"/>
      <text x="14" y="112" font-size="10" fill="var(--text-muted-color, #889)">0</text>
      <text x="196" y="112" font-size="10" fill="var(--text-muted-color, #889)">1</text>
      {%- assign xs = "95,105,140,160,120,165,100,150,130,110,155,125" | split: "," -%}
      {%- assign ys = "70,45,55,80,35,50,65,40,72,58,38,75" | split: "," -%}
      {%- for x in xs -%}
      <circle cx="{{ x }}" cy="{{ ys[forloop.index0] }}" r="4" fill="var(--neon-cyan)"/>
      {%- endfor -%}
      <rect x="88" y="8" width="86" height="94" fill="none" stroke="var(--neon-cyan)" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
    </svg>

  {%- when "augmentation" -%}
    <svg class="data-demo-before" viewBox="0 0 240 120" role="img" aria-label="증강 전 원본 이미지 한 장">
      <rect x="95" y="20" width="50" height="50" rx="3" fill="none" stroke="var(--neon-cyan)" stroke-width="2"/>
      <circle cx="112" cy="36" r="4" fill="var(--neon-amber)"/>
      <path d="M100 62 L118 44 L128 54 L140 40" fill="none" stroke="var(--neon-cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg class="data-demo-after" viewBox="0 0 240 120" role="img" aria-label="증강 후 변형된 여러 장" hidden>
      <g transform="translate(15,15)">
        <rect width="44" height="44" rx="3" fill="none" stroke="var(--neon-cyan)" stroke-width="2"/>
        <circle cx="14" cy="14" r="3.5" fill="var(--neon-amber)"/>
        <path d="M8 32 L22 18 L30 26 L40 14" fill="none" stroke="var(--neon-cyan)" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g transform="translate(98,15) scale(-1,1) translate(-44,0)">
        <rect width="44" height="44" rx="3" fill="none" stroke="var(--neon-magenta)" stroke-width="2"/>
        <circle cx="14" cy="14" r="3.5" fill="var(--neon-amber)"/>
        <path d="M8 32 L22 18 L30 26 L40 14" fill="none" stroke="var(--neon-magenta)" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g transform="translate(181,15) rotate(180,22,22)">
        <rect width="44" height="44" rx="3" fill="none" stroke="var(--neon-magenta)" stroke-width="2"/>
        <circle cx="14" cy="14" r="3.5" fill="var(--neon-amber)"/>
        <path d="M8 32 L22 18 L30 26 L40 14" fill="none" stroke="var(--neon-magenta)" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g transform="translate(56,68)">
        <rect width="44" height="44" rx="3" fill="none" stroke="var(--neon-amber)" stroke-width="2"/>
        <circle cx="14" cy="14" r="3.5" fill="var(--neon-amber)"/>
        <path d="M8 32 L22 18 L30 26 L40 14" fill="none" stroke="var(--neon-amber)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="6" cy="38" r="1" fill="var(--neon-amber)"/><circle cx="34" cy="6" r="1" fill="var(--neon-amber)"/>
        <circle cx="38" cy="30" r="1" fill="var(--neon-amber)"/><circle cx="18" cy="36" r="1" fill="var(--neon-amber)"/>
      </g>
      <g transform="translate(139,68)">
        <rect width="44" height="44" rx="3" fill="none" stroke="var(--neon-cyan)" stroke-width="2"/>
        <circle cx="14" cy="14" r="3.5" fill="var(--neon-amber)"/>
        <path d="M8 32 L22 18 L30 26 L40 14" fill="none" stroke="var(--neon-cyan)" stroke-width="2" stroke-linecap="round"/>
      </g>
    </svg>

  {%- when "split" -%}
    <svg class="data-demo-before" viewBox="0 0 240 60" role="img" aria-label="분할 전 전체 데이터">
      <rect x="10" y="15" width="220" height="30" rx="3" fill="rgb(34 224 255 / 12%)" stroke="var(--neon-cyan)" stroke-width="2"/>
      <text x="120" y="34" text-anchor="middle" font-size="12" fill="var(--neon-cyan)">전체 데이터</text>
    </svg>
    <svg class="data-demo-after" viewBox="0 0 240 60" role="img" aria-label="분할 후 학습/검증/테스트" hidden>
      <rect x="10" y="15" width="176" height="30" fill="rgb(34 224 255 / 15%)" stroke="var(--neon-cyan)" stroke-width="2"/>
      <text x="98" y="34" text-anchor="middle" font-size="10" fill="var(--neon-cyan)">학습 80%</text>
      <rect x="186" y="15" width="22" height="30" fill="rgb(255 176 32 / 15%)" stroke="var(--neon-amber)" stroke-width="2"/>
      <rect x="208" y="15" width="22" height="30" fill="rgb(255 59 212 / 15%)" stroke="var(--neon-magenta)" stroke-width="2"/>
      <text x="120" y="55" text-anchor="middle" font-size="8" fill="var(--neon-amber)">검증 10%</text>
      <text x="196" y="55" text-anchor="middle" font-size="8" fill="var(--neon-magenta)">테스트 10%</text>
    </svg>

  {%- endcase -%}

  </div>
</div>
