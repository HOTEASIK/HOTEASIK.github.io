<!-- HOTEASIK · custom metadata hook (injected at end of <head> by Chirpy) -->

<!-- 본문 폰트 (한글 지원) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
>

<!-- 데이터 전처리 전/후 위젯 (전역 로드. 글에서는 data-demo.html include 로 소환) -->
<link rel="stylesheet" href="{{ '/assets/css/data-demo.css' | relative_url }}">
<script defer src="{{ '/assets/js/data-demo.js' | relative_url }}"></script>

<!-- 3단 사이드바 상태 즉시 복원 (깜빡임 방지) -->
<script>
  (function () {
    document.documentElement.setAttribute('data-sb', 'rail');
    try {
      var s = localStorage.getItem('hoteasik-sb');
      // 저장값이 없으면 기본 = 접힌 상태(아이콘 레일)
      if (s !== 'rail' && s !== 'hidden' && s !== 'expanded') s = 'rail';
      document.documentElement.setAttribute('data-sb', s);
      var w = parseInt(localStorage.getItem('hoteasik-sb-w'), 10);
      if (w >= 180 && w <= 480) {
        document.documentElement.style.setProperty('--sb-exp', w + 'px');
      }
    } catch (e) {}
  })();
</script>

<!-- 3단 사이드바 토글 동작 (모든 페이지) -->
<script defer src="{{ '/assets/js/sidebar-collapse.js' | relative_url }}"></script>
